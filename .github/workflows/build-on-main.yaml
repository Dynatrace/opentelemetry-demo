name: Build and push astroshop
on:
  push:
    branches:
      - "main"
    paths:
      - .github/**
      - kubernetes-manifests/**
      - src/**
      - charts/**
      - dynatrace/**
  workflow_dispatch:
    inputs:
      release:
        description: "Create a tag + GitHub release from this branch (patch an older version). Leave unchecked for a dev build."
        type: boolean
        default: false

  workflow_call:
    secrets:
      AWS_ROLE:
        required: true
      GAR_CREDENTIALS:
        required: true
      KUBECONFIG:
        required: true
      OQR_CLIENT_ID:
        required: true
      OQR_CLIENT_SECRET:
        required: true
      OQR_URL:
        required: true
      SNYK_API_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSO_URL:
        required: true

jobs:
  calc-version:
    uses: ./.github/workflows/reusable-calc-version.yaml
    with:
      # manual run with release=true releases from the branch it was started on (patching an older release);
      # without it a manual run on another branch is a dev build: pushes images, no tag or release.
      # Pushes always release from main. See dynatrace/docs/versioning.md
      release-branch: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref_name || 'main' }}

  build:
    # skip-build: version already released, or a push whose commit message has "+semver: skip" / "+semver: none"
    if: needs.calc-version.outputs.skip-build == 'false'
    needs: calc-version
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-build.yaml
    with:
      push: true
      is-pr: false
      version: ${{ needs.calc-version.outputs.version }}
    secrets: inherit

  promote:
    if: needs.calc-version.outputs.is-release == 'true'
    needs:
      - calc-version
      - build
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/reusable-promote-release.yaml
    with:
      version: ${{ needs.calc-version.outputs.version }}
      trigger-deploy: false
