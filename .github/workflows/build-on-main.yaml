name: Build and push astroshop
on:
  push:
    branches:
      - "main"
      - "feat/versioning-and-helm-chart-building"
    paths:
      - .github/**
      - kubernetes-manifests/**
      - src/**
      - charts/**
  workflow_dispatch:

  workflow_call:
    secrets:
      GAR_CREDENTIALS:
        required: true
      KUBECONFIG:
        required: true
      OQR_CLIENT_ID:
        required: true
      OQR_CLIENT_SECRET:
        required: true
      OQR_URL:
        required: true
      SNYK_API_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSO_URL:
        required: true

env:
  GAR_ADDRESS: europe-docker.pkg.dev
  NAMESPACE: astroshop
  CONTAINER_REGISTRY: europe-docker.pkg.dev/dynatrace-demoability/docker/astroshop
  HELM_REGISTRY: oci://europe-docker.pkg.dev/dynatrace-demoability/helm
  HELM_CHART_PATH: charts/astroshop

jobs:
  calc-version:
    uses: ./.github/workflows/reusable-calc-version.yaml

  build-push-astroshop:
    if: needs.calc-version.outputs.already-released == 'false'
    needs: calc-version
    uses: ./.github/workflows/build-and-push-images.yaml
    with:
      push: true
      version: ${{ needs.calc-version.outputs.version }}
    secrets: inherit

  build-push-helm:
    if: needs.calc-version.outputs.already-released == 'false'
    runs-on: ubuntu-24.04
    needs: calc-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push Helm chart
        uses: ./.github/actions/build-push-helm
        with:
          chart-path: ${{ env.HELM_CHART_PATH }}
          push: true
          registry-url: ${{ env.HELM_REGISTRY }}
          version: ${{ needs.calc-version.outputs.version }}
          credentials: ${{ secrets.GAR_CREDENTIALS }}

  promote:
    if: needs.calc-version.outputs.is-release == 'true'
    needs:
      - calc-version
      - build-push-astroshop
      - build-push-helm
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/reusable-promote-release.yaml
    with:
      version: ${{ needs.calc-version.outputs.version }}
      trigger-deploy: false