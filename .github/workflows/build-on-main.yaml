name: Build and push astroshop
on:
  push:
    branches:
      - "main"
    paths:
      - .github/**
      - kubernetes-manifests/**
      - src/**
      - src-dt/**
      - charts/**
      - dynatrace/**
  workflow_dispatch:

  workflow_call:
    secrets:
      AWS_ROLE:
        required: true
      GAR_CREDENTIALS:
        required: true
      KUBECONFIG:
        required: true
      OQR_CLIENT_ID:
        required: true
      OQR_CLIENT_SECRET:
        required: true
      OQR_URL:
        required: true
      SNYK_API_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSO_URL:
        required: true

jobs:
  calc-version:
    uses: ./.github/workflows/reusable-calc-version.yaml

  build:
    if: needs.calc-version.outputs.already-released == 'false'
    needs: calc-version
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-build.yaml
    with:
      push: true
      is-pr: false
      version: ${{ needs.calc-version.outputs.version }}
    secrets: inherit

  promote:
    if: needs.calc-version.outputs.is-release == 'true'
    needs:
      - calc-version
      - build
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/reusable-promote-release.yaml
    with:
      version: ${{ needs.calc-version.outputs.version }}
      trigger-deploy: false
