name: "Build and Push ECR Image"
description: "Build a cloud-backend service image with docker buildx bake and optionally push it to Amazon ECR"
inputs:
  service:
    description: "Compose service name to build. Accepts several, space separated, which must be baked together when one is another's base image."
    required: true
  version:
    description: "Image tag; interpolated into the compose file as ${VERSION}"
    required: true
  ecr-registry:
    description: "ECR registry host, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com. The caller is responsible for logging in when pushing."
    required: true
  push:
    description: "Whether to push the image to ECR"
    required: false
    default: "false"
  working-directory:
    description: "Directory to run the build from; buildx bake resolves build contexts relative to it"
    required: false
    default: "src-dt/cloud-backend"
  compose-file:
    description: "Path to docker compose file, relative to working-directory"
    required: false
    default: "compose.yaml"
  provenance:
    description: "Whether to attach a provenance attestation. Must be false for images Lambda runs, which reject multi-manifest images."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push image
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SERVICE: ${{ inputs.service }}
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        VERSION: ${{ inputs.version }}
        PUSH: ${{ inputs.push }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
        PROVENANCE: ${{ inputs.provenance }}
      run: |
        set -euo pipefail

        echo "Building $SERVICE as $ECR_REGISTRY/...:$VERSION"

        if [ "$PUSH" == "true" ]; then
          PUSH_FLAG="--push"
          echo "Image will be pushed to ECR"
        else
          PUSH_FLAG="--load"
          echo "Image will be loaded locally"
        fi

        # Build metadata the product-catalog image stamps itself with
        export DT_GITCOMMIT=$(git rev-parse --short HEAD)
        export DT_BUILD="${GITHUB_REF_NAME//\//-}-$DT_GITCOMMIT-$(date -u +%Y%m%d)"

        docker buildx bake \
          --file "$COMPOSE_FILE" \
          --provenance="$PROVENANCE" \
          --set "*.args.GIT_COMMIT=$(git rev-parse HEAD)" \
          --set "*.args.GIT_ORIGIN=$(git config --get remote.origin.url)" \
          $PUSH_FLAG \
          $SERVICE

        echo "Successfully built $SERVICE with tag: $VERSION"
