name: "Log in to Amazon ECR"
description: "Authenticate Docker to ECR and output the registry host"

outputs:
  registry:
    description: "ECR registry host, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com"
    value: ${{ steps.login.outputs.registry }}

runs:
  using: composite
  steps:
    - name: Log in to ECR
      id: login
      uses: aws-actions/amazon-ecr-login@v2
