name: "Build and Push Docker Image"
description: "Build a single Docker image using docker buildx and optionally push to registry"
inputs:
  service:
    description: "Service name to build (from docker-compose)"
    required: true
  push:
    description: "Whether to push image to registry"
    required: false
    default: "false"
  tag:
    description: "Tag for the Docker image"
    required: true
  push-latest:
    description: "Whether to also push image with 'latest' tag"
    required: false
    default: "false"
  registry:
    description: "Docker registry URL"
    required: false
    default: "europe-docker.pkg.dev/dynatrace-demoability/docker/astroshop"
  compose-file:
    description: "Path to docker compose file"
    required: false
    default: "docker-compose.yml"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Retrieve GAR credentials
      if: inputs.push == 'true'
      shell: bash
      run: |
        echo "$GAR_CREDENTIALS" | docker login -u _json_key_base64 --password-stdin europe-docker.pkg.dev

    - name: Build and push image
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGISTRY: ${{ inputs.registry }}
        TAG: ${{ inputs.tag }}
        PUSH: ${{ inputs.push }}
        PUSH_LATEST: ${{ inputs.push-latest }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
      run: |
        echo "Building image for service: $SERVICE with tag: $TAG"
        
        # Source the env files to get all required variables
        set -a
        source .env
        source .env.override
        set +a
        
        # Override with our values
        export DEMO_VERSION="$TAG"
        export IMAGE_NAME="$REGISTRY"
        
        # Determine push flags
        PUSH_FLAG=""
        if [ "$PUSH" == "true" ]; then
          PUSH_FLAG="--push"
          echo "Image will be pushed to registry"
        else
          PUSH_FLAG="--load"
          echo "Image will be loaded locally"
        fi
        
        # Build the single service using docker buildx bake
        # This allows us to use the compose file directly with buildx
        docker buildx bake \
          --file "$COMPOSE_FILE" \
          --set "*.args.GIT_COMMIT=$(git rev-parse HEAD)" \
          --set "*.args.GIT_ORIGIN=$(git config --get remote.origin.url)" \
          $PUSH_FLAG \
          "$SERVICE"
        
        echo "Successfully built $SERVICE with tag: $TAG"

    - name: Push image with latest tag
      if: inputs.push == 'true' && inputs.push-latest == 'true'
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGISTRY: ${{ inputs.registry }}
        TAG: ${{ inputs.tag }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
      run: |
        echo "Building and pushing $SERVICE with latest tag..."
        
        # Source the env files to get all required variables
        set -a
        source .env
        source .env.override
        set +a
        
        # Override with latest tag
        export DEMO_VERSION="latest"
        export IMAGE_NAME="$REGISTRY"
        
        # Build and push with latest tag
        docker buildx bake \
          --file "$COMPOSE_FILE" \
          --set "*.args.GIT_COMMIT=$(git rev-parse HEAD)" \
          --set "*.args.GIT_ORIGIN=$(git config --get remote.origin.url)" \
          --push \
          "$SERVICE"
        
        echo "Successfully pushed $SERVICE with latest tag"
