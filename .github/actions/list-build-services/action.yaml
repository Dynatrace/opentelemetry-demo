name: "List Buildable Services"
description: "List all services from docker-compose that have a build context, then combine them with extra images from images.yaml to produce the build matrix"
inputs:
  compose-file:
    description: "Path to docker compose file"
    required: false
    default: "docker-compose.yml"
  registry:
    description: "Container registry URL used as the registry field for services scanned from the root compose file"
    required: true
  is-pr:
    description: "When true, applies .pr overrides from images.yaml (for pull request builds)"
    required: false
    default: "false"
  images-file:
    description: "Path to the YAML file listing extra images not in the root compose file"
    required: false
    default: ".github/images.yaml"
outputs:
  services:
    description: "JSON array of service names that have build contexts in the root compose file"
    value: ${{ steps.list.outputs.services }}
  count:
    description: "Number of buildable services in the root compose file"
    value: ${{ steps.list.outputs.count }}
  matrix:
    description: "JSON array of image build entries (root services + extra images) for use in strategy.matrix.include"
    value: ${{ steps.matrix.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: List services with build context
      id: list
      shell: bash
      run: |
        # Extract services that have a build: section from docker-compose
        SERVICES=$(awk '/^  [a-z][a-z0-9-]*:/{service=$1} /^    build:/{print service}' ${{ inputs.compose-file }} | tr -d ':' | sort -u)

        JSON_ARRAY=$(echo "$SERVICES" | jq -R -s -c 'split("\n") | map(select(length > 0))')

        COUNT=$(echo "$SERVICES" | wc -l)

        echo "Found $COUNT buildable services"
        echo "Services: $JSON_ARRAY"

        echo "services=$JSON_ARRAY" >> $GITHUB_OUTPUT
        echo "count=$COUNT" >> $GITHUB_OUTPUT

    - name: Build image matrix
      id: matrix
      shell: bash
      env:
        SERVICES: ${{ steps.list.outputs.services }}
        REGISTRY: ${{ inputs.registry }}
        IS_PR: ${{ inputs.is-pr }}
        IMAGES_FILE: ${{ inputs.images-file }}
      run: |
        set -euo pipefail

        # Root compose services all share one GAR registry; service name is the tag suffix
        ROOT=$(jq -c --arg r "$REGISTRY" '[ .[] | {
          service: ., directory: ".", "compose-file": "docker-compose.yml",
          "registry-type": "gar", registry: $r
        } ]' <<<"$SERVICES")

        # Extra images from images.yaml; apply .pr overrides on pull requests
        if [ "$IS_PR" == "true" ]; then
          EXTRA=$(yq -o=json '.images' "$IMAGES_FILE" | jq -c 'map(. * (.pr // {}) | del(.pr))')
        else
          EXTRA=$(yq -o=json '.images' "$IMAGES_FILE" | jq -c 'map(del(.pr))')
        fi

        MATRIX=$(jq -c -n --argjson a "$ROOT" --argjson b "$EXTRA" '$a + $b')
        echo "Building $(jq length <<<"$MATRIX") images"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
