name: "Calculate Version"
description: "Calculate semantic version from git history and determine if it is a release"
inputs:
  release-branch:
    description: "Branch name that triggers releases"
    required: false
    default: "main"

outputs:
  version:
    description: "Calculated semantic version"
    value: ${{ steps.final-version.outputs.version }}
  is-release:
    description: "Whether this is a release build (true/false)"
    value: ${{ steps.check-release.outputs.is-release }}
  already-released:
    description: "DEPRECATED, use skip-build. Whether this version has already been released (true/false)."
    value: ${{ steps.check-tag.outputs.already-released }}
  skip-build:
    description: "true when build/publish/release must be skipped: the version is already released, or (push events only) the head commit message contains '+semver: skip' or '+semver: none'."
    value: ${{ steps.check-skip.outputs.skip-build }}

runs:
  using: composite
  steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.5.0
      with:
        versionSpec: "6.x"

    - name: Create GitVersion config
      shell: bash
      run: |
        CONFIG_FILE="/tmp/GitVersion.yml"
        cat > "$CONFIG_FILE" << 'EOF'
        assembly-informational-format: "{MajorMinorPatch}-{PreReleaseLabel}-{ShortSha}"
        label: "{BranchName:l}"
        major-version-bump-message: '\+semver:\s?(breaking|major)'
        minor-version-bump-message: '\+semver:\s?(feature|minor)'
        patch-version-bump-message: '\+semver:\s?(fix|patch)'
        no-bump-message: '\+semver:\s?(none|skip)'
        branches:
          main:
            label: main
            increment: Minor
          pull-request:
            label: pr{Number}
          # Branches other than main/PR (e.g. maintenance branches cut from an old tag) only use tags
          # reachable from their own history, never tags that exist only on main.
          feature:
            increment: Patch
            source-branches: []
          unknown:
            increment: Patch
            source-branches: []
        EOF
        echo "GITVERSION_CONFIG=$CONFIG_FILE" >> $GITHUB_ENV
        echo "Created GitVersion config:"
        cat "$CONFIG_FILE"

    # GitVersion falls back to main as source branch for any branch without source branches and then uses
    # tags that exist only on main (e.g. a branch cut from tag 0.1.7 would get 1.0.1 from main's v1.0.0).
    # On builds of any other branch (including a maintenance branch that is passed as release-branch) hide
    # main/master so only tags reachable from the branch itself are used.
    - name: Hide main branch from GitVersion
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
          CURRENT="${GITHUB_REF#refs/heads/}"
          if [[ "$CURRENT" != "main" && "$CURRENT" != "master" ]]; then
            for b in main master; do
              git update-ref -d "refs/remotes/origin/$b" || true
              git update-ref -d "refs/heads/$b" || true
            done
            echo "Hid main/master refs; versioning from branch history only"
          fi
        fi

    - name: Determine Version
      id: version
      uses: gittools/actions/gitversion/execute@v4.5.0
      with:
        configFilePath: ${{ env.GITVERSION_CONFIG }}

    - name: Check if release
      id: check-release
      shell: bash
      run: |
        CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
        if [ "$CURRENT_BRANCH" = "${{ inputs.release-branch }}" ]; then
          echo "is-release=true" >> $GITHUB_OUTPUT
          echo "This is a release build from ${{ inputs.release-branch }}"
        else
          echo "is-release=false" >> $GITHUB_OUTPUT
          echo "This is not a release build (current branch: $CURRENT_BRANCH)"
        fi

    - name: Set final version
      id: final-version
      shell: bash
      run: |
        if [ "${{ steps.check-release.outputs.is-release }}" = "true" ]; then
          # If on release branch, use major.minor.patch to create new release
          VERSION="${{ steps.version.outputs.majorMinorPatch }}"
        elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # If on tag, return that tag as current version
          VERSION="${{ steps.version.outputs.majorMinorPatch }}"
        else
          # For other branches, use major.minor.patch
          VERSION="${{ steps.version.outputs.informationalVersion }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Final version: $VERSION"

    - name: Check if version already released
      id: check-tag
      shell: bash
      run: |
        VERSION="${{ steps.final-version.outputs.version }}"
        if git rev-parse "v$VERSION" >/dev/null 2>&1; then
          echo "already-released=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION has already been released. Build will be skipped."
        else
          echo "already-released=false" >> $GITHUB_OUTPUT
          echo "Version $VERSION has not been released yet."
        fi

    # Commit message is only available on push (github.event.head_commit); manual runs and PR builds ignore the marker.
    # Passed via env, never interpolated into the script.
    - name: Check if build should be skipped
      id: check-skip
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        ALREADY_RELEASED: ${{ steps.check-tag.outputs.already-released }}
      run: |
        SKIP=false
        REASON="not skipped"
        if [ "$ALREADY_RELEASED" = "true" ]; then
          SKIP=true
          REASON="version already released"
        elif [ "$EVENT_NAME" = "push" ] && printf '%s' "$COMMIT_MESSAGE" | grep -qiE '\+semver:\s?(skip|none)'; then
          SKIP=true
          REASON="+semver: skip/none marker in commit message"
        fi
        echo "skip-build=$SKIP" >> $GITHUB_OUTPUT
        echo "Skip build: $SKIP ($REASON)"
        echo "SKIP_REASON=$REASON" >> $GITHUB_ENV

    - name: Show version
      shell: bash
      run: |
        echo "Version: ${{ steps.final-version.outputs.version }}"
        echo "Is release: ${{ steps.check-release.outputs.is-release }}"
        echo "Version already released: ${{ steps.check-tag.outputs.already-released }}"
        echo "Skip build: ${{ steps.check-skip.outputs.skip-build }} ($SKIP_REASON)"
        echo "### Version: ${{ steps.final-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Is release:** ${{ steps.check-release.outputs.is-release }}" >> $GITHUB_STEP_SUMMARY
        echo "**Version already released:** ${{ steps.check-tag.outputs.already-released }}" >> $GITHUB_STEP_SUMMARY
        echo "**Skip build:** ${{ steps.check-skip.outputs.skip-build }} ($SKIP_REASON)" >> $GITHUB_STEP_SUMMARY
