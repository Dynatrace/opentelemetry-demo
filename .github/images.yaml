# Images that are not services of the root docker-compose.yml. The image build
# matrix is these entries plus every buildable service scanned from that file.
#
# registry-type drives how the build authenticates:
#   gar - Google Artifact Registry, logged in by the build action itself
#   ecr - Amazon ECR, needs OIDC credentials and an ECR login first
#
# A `pr` block overrides fields on pull requests, which hold no AWS credentials.
images:
  - service: consumer-service-vulnerable
    directory: src-dt/consumer-service
    compose-file: compose.yaml
    registry-type: gar
    registry: europe-docker.pkg.dev/dynatrace-demoability/docker/astroshop-consumer-service

  - service: consumer-service-healthy
    directory: src-dt/consumer-service
    compose-file: compose.yaml
    registry-type: gar
    registry: europe-docker.pkg.dev/dynatrace-demoability/docker/astroshop-consumer-service

  - service: load-generator
    directory: src-dt/load-generator
    compose-file: compose.yaml
    registry-type: gar
    registry: europe-docker.pkg.dev/dynatrace-demoability/docker/cloud-backend-load-generator

  - service: data-processing
    directory: src-dt/cloud-backend
    compose-file: compose.yaml
    registry-type: ecr
    provenance: "true"

  - service: processed-data-persistence
    directory: src-dt/cloud-backend
    compose-file: compose.yaml
    registry-type: ecr
    provenance: "true"

  # All four bake together: the stage variants use the base image as an
  # additional build context, which only resolves within one run. The variants
  # need the OneAgent extension, fetched from AWS, so pull requests build only
  # the base image.
  - service: >-
      product-catalog-lambda-image
      product-catalog-lambda-image-dev
      product-catalog-lambda-image-hardening
      product-catalog-lambda-image-prod
    directory: src-dt/cloud-backend
    compose-file: compose.yaml
    registry-type: ecr
    provenance: "false"
    needs-oneagent-layer: "true"
    pr:
      service: product-catalog-lambda-image
      needs-oneagent-layer: "false"
