{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: &name load-generator-credentials
  namespace: "{{ .Release.Namespace }}"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: *name
    creationPolicy: Owner
  # Property names mirror the product-catalog Secrets Manager entry, so this can
  # be repointed at it with a remoteKey change if the operator is ever granted
  # read access to the astroshop-<environment>-* prefix
  data:
    - secretKey: USERNAME
      remoteRef:
        key: &key {{ required "externalSecret.remoteKey is required when externalSecret.enabled" .Values.externalSecret.remoteKey | quote }}
        property: PRODUCT_ADMIN_USER
    - secretKey: PASSWORD
      remoteRef:
        key: *key
        property: PRODUCT_ADMIN_PASSWORD
{{- end }}
