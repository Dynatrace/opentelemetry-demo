apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-loadgen
  labels:
    app.kubernetes.io/name: otel-loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-loadgen
    spec:
      containers:
        - name: otel-loadgen
          image: europe-docker.pkg.dev/dynatrace-demoability/docker/otel-loadgen:v2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 3Gi
          envFrom:
            - configMapRef:
                name: otel-loadgen-config
